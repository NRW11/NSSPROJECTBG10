<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แผน Migrate NSS — กันยายน 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0d1b1e;
    --panel:#12262a;
    --panel-2:#17323780;
    --line: #2a4a4f;
    --paper:#eef3ee;
    --paper-dim:#b9c9c6;
    --bg1:#3fb7a8;   /* teal   - BG1 */
    --bg2:#e0a53c;   /* amber  - BG2 */
    --bg9:#e0664f;   /* clay   - BG9 */
    --grid-track:#0a1517;
    --radius: 10px;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0;
    background: var(--ink);
    color: var(--paper);
    font-family:"Noto Sans Thai","IBM Plex Mono",sans-serif;
    min-height:100vh;
  }
  body{
    background-image:
      radial-gradient(circle at 15% 0%, #14343133 0%, transparent 40%),
      radial-gradient(circle at 90% 10%, #2a4a4f22 0%, transparent 45%);
  }

  .wrap{ max-width: 1180px; margin: 0 auto; padding: 28px 20px 60px; }

  /* ---------- Header ---------- */
  header{
    display:flex; flex-wrap:wrap; gap:20px;
    justify-content:space-between; align-items:flex-end;
    border-bottom: 1px solid var(--line);
    padding-bottom: 18px; margin-bottom: 22px;
  }
  .eyebrow{
    font-family:"IBM Plex Mono", monospace;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-size: 11px;
    color: var(--bg1);
    margin: 0 0 6px;
  }
  h1{
    font-family:"Chakra Petch", sans-serif;
    font-weight:700;
    font-size: clamp(24px, 3.4vw, 34px);
    margin:0;
    letter-spacing: 0.01em;
  }
  h1 span{ color: var(--paper-dim); font-weight:500; }
  .sub{
    font-size: 13px;
    color: var(--paper-dim);
    margin-top: 6px;
    font-family:"IBM Plex Mono", monospace;
  }
  .totals{
    display:flex; gap:10px; flex-wrap:wrap;
  }
  .total-chip{
    font-family:"IBM Plex Mono", monospace;
    font-size:12px;
    border:1px solid var(--line);
    border-radius: 999px;
    padding:7px 14px;
    display:flex; align-items:center; gap:8px;
    background: var(--panel);
  }
  .dot{ width:8px; height:8px; border-radius:50%; flex:none; }
  .total-chip b{ font-family:"Chakra Petch"; font-size:14px; color:var(--paper); }

  /* ---------- Filter tabs ---------- */
  .tabs{
    display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap;
  }
  .tab{
    font-family:"IBM Plex Mono", monospace;
    font-size:12.5px;
    letter-spacing:0.03em;
    padding:9px 16px;
    border-radius: 999px;
    border:1px solid var(--line);
    background: transparent;
    color: var(--paper-dim);
    cursor:pointer;
    transition: all .15s ease;
    display:flex; align-items:center; gap:8px;
  }
  .tab:hover{ border-color:#4a6f74; color:var(--paper); }
  .tab.active{
    background: var(--paper);
    color: var(--ink);
    border-color: var(--paper);
    font-weight:600;
  }
  .tab .dot{ width:7px; height:7px; }

  /* ---------- Calendar ---------- */
  .cal-head{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-bottom:10px;
  }
  .cal-head .month-label{
    font-family:"Chakra Petch"; font-weight:600; font-size:15px; color:var(--paper-dim);
  }
  .weekdays{
    display:grid;
    grid-template-columns: repeat(7, 1fr);
    gap:6px;
    margin-bottom:6px;
  }
  .weekdays div{
    text-align:center;
    font-family:"IBM Plex Mono", monospace;
    font-size:11px;
    letter-spacing:0.08em;
    color: var(--paper-dim);
    text-transform:uppercase;
    padding-bottom:4px;
  }
  .grid{
    display:grid;
    grid-template-columns: repeat(7, 1fr);
    gap:6px;
    background: var(--grid-track);
    padding:6px;
    border-radius: 14px;
    border: 1px solid var(--line);
  }
  .cell{
    background: var(--panel);
    border-radius: var(--radius);
    min-height: 108px;
    padding: 9px 9px 8px;
    display:flex; flex-direction:column;
    cursor:default;
    border: 1px solid transparent;
    position:relative;
    transition: border-color .15s ease, transform .1s ease;
  }
  .cell.empty{ background:transparent; }
  .cell.has-data{ cursor:pointer; }
  .cell.has-data:hover{
    border-color:#4a6f74;
    transform: translateY(-1px);
  }
  .cell .daynum{
    font-family:"Chakra Petch"; font-weight:600; font-size:15px;
    color: var(--paper);
  }
  .cell.weekend .daynum{ color: var(--paper-dim); }
  .cell .count-badge{
    position:absolute; top:8px; right:9px;
    font-family:"IBM Plex Mono", monospace;
    font-size:11px;
    color: var(--paper-dim);
  }
  .chips{
    margin-top:auto;
    display:flex; flex-direction:column; gap:3px;
  }
  .chip-row{
    display:flex; align-items:center; gap:5px;
    font-family:"IBM Plex Mono", monospace;
    font-size:11px;
    color: var(--paper);
  }
  .chip-row .sq{ width:7px; height:7px; border-radius:2px; flex:none; }
  .chip-row .n{ color: var(--paper-dim); }

  /* ---------- Legend ---------- */
  .legend-note{
    margin-top:14px;
    font-family:"IBM Plex Mono", monospace;
    font-size:11.5px;
    color: var(--paper-dim);
  }

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed; inset:0;
    background: rgba(5,12,13,0.72);
    backdrop-filter: blur(2px);
    display:none;
    align-items:center; justify-content:center;
    z-index:50;
    padding: 20px;
  }
  .overlay.show{ display:flex; }
  .modal{
    background: var(--panel);
    border:1px solid var(--line);
    border-radius: 16px;
    width: 100%; max-width: 480px;
    max-height: 82vh;
    display:flex; flex-direction:column;
    overflow:hidden;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6);
  }
  .modal-head{
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--line);
    display:flex; justify-content:space-between; align-items:flex-start;
    gap:12px;
  }
  .modal-head .date-label{
    font-family:"Chakra Petch"; font-weight:700; font-size:20px;
  }
  .modal-head .date-sub{
    font-family:"IBM Plex Mono", monospace;
    font-size:11.5px; color:var(--paper-dim); margin-top:3px;
  }
  .close-btn{
    background:none; border:1px solid var(--line); color:var(--paper-dim);
    width:30px; height:30px; border-radius:8px; cursor:pointer;
    font-size:15px; line-height:1; flex:none;
  }
  .close-btn:hover{ color:var(--paper); border-color:#4a6f74; }
  .modal-body{ overflow-y:auto; padding: 8px 10px 16px; }
  .zone-group{ margin-top:10px; }
  .zone-group:first-child{ margin-top:6px; }
  .zone-title{
    font-family:"IBM Plex Mono", monospace;
    font-size:11.5px; letter-spacing:0.06em;
    padding: 6px 10px;
    display:flex; align-items:center; gap:8px;
    color: var(--paper-dim);
  }
  .zone-title .sq{ width:8px; height:8px; border-radius:2px; }
  .zone-title b{ color:var(--paper); font-family:"Chakra Petch"; font-size:12.5px; }
  ul.store-list{ list-style:none; margin:0; padding:0; }
  ul.store-list li{
    display:flex; justify-content:space-between; gap:10px;
    padding: 9px 12px;
    margin: 0 4px 3px;
    border-radius: 8px;
    background: var(--panel-2);
    font-size: 13.5px;
  }
  ul.store-list li .no{
    font-family:"IBM Plex Mono", monospace;
    font-size:11px; color: var(--paper-dim);
    flex:none; padding-top:1px;
  }
  .empty-modal{
    padding: 30px 20px; text-align:center; color:var(--paper-dim); font-size:13px;
  }

  @media (max-width: 640px){
    .cell{ min-height: 78px; padding:7px 6px 6px; }
    .weekdays div{ font-size:10px; }
    .chip-row{ font-size:10px; }
    .cell .daynum{ font-size:13px; }
  }
</style>
</head>

</div>

const ZONES = {
  BG1: { color: "var(--bg1)", label: "BG1" },
  BG2: { color: "var(--bg2)", label: "BG2" },
  BG9: { color: "var(--bg9)", label: "BG9" },
};

let activeZone = "ALL";

// ---------- Build totals ----------
const totalsEl = document.getElementById('totals');
Object.keys(ZONES).forEach(z => {
  const count = STORES.filter(s => s.zone === z).length;
  const chip = document.createElement('div');
  chip.className = 'total-chip';
  chip.innerHTML = `<span class="dot" style="background:${ZONES[z].color}"></span>${ZONES[z].label} <b>${count}</b> ร้าน`;
  totalsEl.appendChild(chip);
});

// ---------- Build tabs ----------
const tabsEl = document.getElementById('tabs');
function renderTabs(){
  tabsEl.innerHTML = '';
  const allTab = document.createElement('button');
  allTab.className = 'tab' + (activeZone === 'ALL' ? ' active' : '');
  allTab.textContent = `ทั้งหมด (${STORES.length})`;
  allTab.onclick = () => { activeZone = 'ALL'; renderTabs(); renderGrid(); };
  tabsEl.appendChild(allTab);

  Object.keys(ZONES).forEach(z => {
    const count = STORES.filter(s => s.zone === z).length;
    const tab = document.createElement('button');
    tab.className = 'tab' + (activeZone === z ? ' active' : '');
    tab.innerHTML = `<span class="dot" style="background:${ZONES[z].color}"></span>${ZONES[z].label} (${count})`;
    tab.onclick = () => { activeZone = z; renderTabs(); renderGrid(); };
    tabsEl.appendChild(tab);
  });
}

// ---------- Calendar math: Sept 2026 ----------
const YEAR = 2026, MONTH = 8; // 0-indexed: 8 = September
const daysInMonth = new Date(YEAR, MONTH + 1, 0).getDate();
const firstWeekday = (new Date(YEAR, MONTH, 1).getDay() + 6) % 7; // Mon=0..Sun=6

const gridEl = document.getElementById('grid');
const filteredTotalEl = document.getElementById('filtered-total');

function storesForDay(day, zoneFilter){
  return STORES.filter(s => s.day === day && (zoneFilter === 'ALL' || s.zone === zoneFilter));
}

function renderGrid(){
  gridEl.innerHTML = '';
  const visibleStores = STORES.filter(s => activeZone === 'ALL' || s.zone === activeZone);
  filteredTotalEl.textContent = `${visibleStores.length} ร้าน ในเดือนนี้`;

  for(let i=0;i<firstWeekday;i++){
    const empty = document.createElement('div');
    empty.className = 'cell empty';
    gridEl.appendChild(empty);
  }

  for(let day=1; day<=daysInMonth; day++){
    const cell = document.createElement('div');
    const weekdayIdx = (firstWeekday + day - 1) % 7;
    const isWeekend = weekdayIdx === 5 || weekdayIdx === 6;
    const dayStores = storesForDay(day, activeZone);
    cell.className = 'cell' + (isWeekend ? ' weekend' : '') + (dayStores.length ? ' has-data' : '');

    const daynum = document.createElement('div');
    daynum.className = 'daynum';
    daynum.textContent = day;
    cell.appendChild(daynum);

    if(dayStores.length){
      const badge = document.createElement('div');
      badge.className = 'count-badge';
      badge.textContent = dayStores.length;
      cell.appendChild(badge);

      const chips = document.createElement('div');
      chips.className = 'chips';
      const zonesPresent = activeZone === 'ALL' ? Object.keys(ZONES) : [activeZone];
      zonesPresent.forEach(z => {
        const n = dayStores.filter(s => s.zone === z).length;
        if(n > 0){
          const row = document.createElement('div');
          row.className = 'chip-row';
          row.innerHTML = `<span class="sq" style="background:${ZONES[z].color}"></span>${ZONES[z].label} <span class="n">${n}</span>`;
          chips.appendChild(row);
        }
      });
      cell.appendChild(chips);

      cell.onclick = () => openModal(day, dayStores);
    }

    gridEl.appendChild(cell);
  }
}

// ---------- Modal ----------
const overlay = document.getElementById('overlay');
const modalDate = document.getElementById('modal-date');
const modalSub = document.getElementById('modal-sub');
const modalBody = document.getElementById('modal-body');
const closeBtn = document.getElementById('close-btn');
const THAI_WEEKDAY = ['จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์','อาทิตย์'];

function openModal(day, dayStores){
  const weekdayIdx = (firstWeekday + day - 1) % 7;
  modalDate.textContent = `${day} กันยายน 2026`;
  modalSub.textContent = `วัน${THAI_WEEKDAY[weekdayIdx]} · ${dayStores.length} ร้านเข้าติดตั้ง`;

  modalBody.innerHTML = '';
  if(dayStores.length === 0){
    modalBody.innerHTML = '<div class="empty-modal">ไม่มีร้านเข้าในวันนี้</div>';
  } else {
    Object.keys(ZONES).forEach(z => {
      const list = dayStores.filter(s => s.zone === z);
      if(list.length === 0) return;
      const group = document.createElement('div');
      group.className = 'zone-group';
      group.innerHTML = `<div class="zone-title"><span class="sq" style="background:${ZONES[z].color}"></span><b>${ZONES[z].label}</b> — ${list.length} ร้าน</div>`;
      const ul = document.createElement('ul');
      ul.className = 'store-list';
      list.forEach(s => {
        const li = document.createElement('li');
        li.innerHTML = `<span>${s.storeName}</span><span class="no">#${s.storeNo}</span>`;
        ul.appendChild(li);
      });
      group.appendChild(ul);
      modalBody.appendChild(group);
    });
  }
  overlay.classList.add('show');
}
closeBtn.onclick = () => overlay.classList.remove('show');
overlay.onclick = (e) => { if(e.target === overlay) overlay.classList.remove('show'); };
document.addEventListener('keydown', (e) => { if(e.key === 'Escape') overlay.classList.remove('show'); });

renderTabs();
renderGrid();
</script>
