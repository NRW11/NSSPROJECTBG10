<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Sarabun','Noto Sans Thai',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;overscroll-behavior:none}
.topbar{background:linear-gradient(135deg,#1e3a5f,#312e81);padding:14px 16px 12px;border-bottom:1px solid rgba(99,102,241,.3);display:flex;align-items:center;gap:12px}
.app-icon{width:40px;height:40px;flex-shrink:0}
.topbar-text h1{font-size:17px;font-weight:700;background:linear-gradient(135deg,#818cf8,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.topbar-text p{font-size:10px;color:#64748b;margin-top:2px}
.updated{font-size:10px;color:#f59e0b}
.install-bar{display:none;background:rgba(99,102,241,.15);border-bottom:1px solid rgba(99,102,241,.3);padding:8px 16px;align-items:center;gap:10px}
.install-bar.show{display:flex}
.install-bar p{font-size:12px;color:#a5b4fc;flex:1}
.install-btn{background:rgba(99,102,241,.8);color:#fff;border:none;border-radius:8px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
.ios-hint{display:none;background:rgba(99,102,241,.1);border-bottom:1px solid rgba(99,102,241,.2);padding:8px 16px}
.ios-hint.show{display:block}
.ios-hint p{font-size:11px;color:#818cf8;text-align:center}
.stats{display:flex;gap:8px;padding:10px 16px;border-bottom:1px solid rgba(255,255,255,.06);flex-wrap:wrap}
.stat{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:6px 14px;text-align:center;min-width:72px}
.stat-num{font-size:18px;font-weight:700}
.stat-label{font-size:10px;color:#94a3b8}
