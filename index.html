<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แผน NSS BG10 — ก.ย.–ต.ค. 2569</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun','Noto Sans Thai',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
.topbar{background:linear-gradient(135deg,#1e3a5f,#1e293b);padding:14px 16px 12px;border-bottom:1px solid rgba(99,102,241,.3)}
.topbar h1{font-size:18px;font-weight:700;background:linear-gradient(135deg,#818cf8,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.topbar p{font-size:11px;color:#64748b;margin-top:3px}
.updated{font-size:10px;color:#f59e0b;margin-top:4px}
.stats{display:flex;gap:8px;padding:10px 16px;border-bottom:1px solid rgba(255,255,255,.06);flex-wrap:wrap}
.stat{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:6px 14px;text-align:center;min-width:72px}
.stat-num{font-size:18px;font-weight:700}
.stat-label{font-size:10px;color:#94a3b8}
.toolbar{display:flex;gap:8px;padding:10px 16px;align-items:center;flex-wrap:wrap;border-bottom:1px solid rgba(255,255,255,.06)}
.toolbar label{font-size:12px;color:#94a3b8}
.search-box{background:#1e293b;border:1px solid rgba(255,255,255,.15);border-radius:6px;padding:5px 10px;color:#e2e8f0;font-family:inherit;font-size:12px;width:180px}
.search-box::placeholder{color:#475569}
.mtabs{display:flex;gap:5px}
.mtab{padding:6px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#94a3b8;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s}
.mtab.active{background:rgba(99,102,241,.4);border-color:#6366f1;color:#c7d2fe}
.view-btns{display:flex;gap:4px;margin-left:auto}
.vbtn{padding:5px 12px;border-radius:6px;border:1px solid rgba(255,255,255,.1);background:transparent;color:#64748b;font-size:12px;cursor:pointer;font-family:inherit;transition:all .15s}
.vbtn.active{background:rgba(99,102,241,.4);border-color:#6366f1;color:#c7d2fe}

/* TABLE */
.table-wrap{overflow-x:auto;padding:12px 16px}
table{width:100%;border-collapse:collapse;min-width:580px}
