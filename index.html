<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Sarabun','Noto Sans Thai',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;overscroll-behavior:none}
.topbar{background:linear-gradient(135deg,#1e3a5f,#312e81);padding:14px 16px 12px;border-bottom:1px solid rgba(99,102,241,.3);display:flex;align-items:center;gap:12px}
.app-icon{width:40px;height:40px;flex-shrink:0}
.topbar-text h1{font-size:17px;font-weight:700;background:linear-gradient(135deg,#818cf8,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.topbar-text p{font-size:10px;color:#64748b;margin-top:2px}
.updated{font-size:10px;color:#f59e0b}
.install-bar{display:none;background:rgba(99,102,241,.15);border-bottom:1px solid rgba(99,102,241,.3);padding:8px 16px;align-items:center;gap:10px}
.install-bar.show{display:flex}
.install-bar p{font-size:12px;color:#a5b4fc;flex:1}
.install-btn{background:rgba(99,102,241,.8);color:#fff;border:none;border-radius:8px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
.ios-hint{display:none;background:rgba(99,102,241,.1);border-bottom:1px solid rgba(99,102,241,.2);padding:8px 16px}
.ios-hint.show{display:block}
.ios-hint p{font-size:11px;color:#818cf8;text-align:center}
.stats{display:flex;gap:8px;padding:10px 16px;border-bottom:1px solid rgba(255,255,255,.06);flex-wrap:wrap}
.stat{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:6px 14px;text-align:center;min-width:72px}
.stat-num{font-size:18px;font-weight:700}
.stat-label{font-size:10px;color:#94a3b8}
.toolbar{display:flex;gap:8px;padding:10px 16px;align-items:center;flex-wrap:wrap;border-bottom:1px solid rgba(255,255,255,.06)}
.search-box{background:#1e293b;border:1px solid rgba(255,255,255,.15);border-radius:6px;padding:5px 10px;color:#e2e8f0;font-family:inherit;font-size:12px;width:160px}
.search-box::placeholder{color:#475569}
.mtabs{display:flex;gap:5px}
.mtab{padding:6px 13px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#94a3b8;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s}
.mtab.active{background:rgba(99,102,241,.4);border-color:#6366f1;color:#c7d2fe}
.view-btns{display:flex;gap:4px;margin-left:auto}
.vbtn{padding:5px 11px;border-radius:6px;border:1px solid rgba(255,255,255,.1);background:transparent;color:#64748b;font-size:12px;cursor:pointer;font-family:inherit;transition:all .15s}
.vbtn.active{background:rgba(99,102,241,.4);border-color:#6366f1;color:#c7d2fe}
.table-wrap{overflow-x:auto;padding:10px 14px}
table{width:100%;border-collapse:collapse;min-width:520px}
th{background:#1e293b;color:#94a3b8;font-size:11px;font-weight:700;padding:9px 10px;text-align:left;border-bottom:2px solid rgba(99,102,241,.3);white-space:nowrap}
td{padding:8px 10px;font-size:12px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:middle}
tr:hover td{background:rgba(255,255,255,.03)}
.zone-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700;border:1px solid;background:rgba(139,92,246,.15);color:#c4b5fd;border-color:rgba(139,92,246,.4)}
.peak-tag{display:inline-block;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);color:#fca5a5;border-radius:4px;font-size:10px;padding:2px 5px;margin:1px 2px 1px 0}
.we-row td:first-child,.wdc{color:#fbbf24!important}
.store-no{color:#64748b;font-size:11px;font-family:monospace}
.no-data{text-align:center;color:#334155;padding:40px;font-size:13px}
.cal-wrap{padding:10px 14px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-hdr{text-align:center;padding:7px 1px;font-size:11px;font-weight:700;color:#64748b}
.cal-hdr.we{color:#f87171}
.cal-day{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:8px;padding:6px 4px;min-height:68px;cursor:pointer;transition:all .15s}
.cal-day.has{border-color:rgba(139,92,246,.35)}
.cal-day.sel{border-color:#7c3aed!important;background:rgba(124,58,237,.2);box-shadow:0 0 0 1px #7c3aed}
.cal-day.we-bg{background:rgba(251,191,36,.03)}
.cal-day.empty{background:transparent;border-color:transparent;cursor:default}
.cal-dnum{font-size:11px;font-weight:700;color:#cbd5e1;margin-bottom:3px}
.cal-dnum.we{color:#f87171}
.cal-pill{font-size:9px;padding:2px 4px;border-radius:3px;background:rgba(139,92,246,.25);color:#c4b5fd;margin-bottom:2px}
.cal-tot{font-size:9px;color:#475569}
.dp{background:#1e293b;border-top:2px solid rgba(124,58,237,.4);padding:14px;display:none;margin-top:3px}
.dp.show{display:block}
.dp-title{font-size:14px;font-weight:700;color:#c7d2fe;margin-bottom:10px}
.dp-stores{display:flex;flex-direction:column;gap:5px;max-height:300px;overflow-y:auto}
.dp-store{display:flex;align-items:flex-start;gap:8px;background:rgba(255,255,255,.04);border-radius:7px;padding:8px 10px}
.dp-info{flex:1;min-width:0}
.dp-sname{font-size:12px;font-weight:500;color:#e2e8f0}
.dp-meta{display:flex;align-items:center;gap:6px;margin-top:3px;flex-wrap:wrap}
.dp-sno{color:#475569;font-size:10px;font-family:monospace}
.dp-peak{display:inline-flex;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);color:#fca5a5;border-radius:4px;font-size:10px;padding:2px 6px}
.zdot{width:7px;height:7px;border-radius:50%;background:#8b5cf6;flex-shrink:0;margin-top:4px}
.hidden{display:none}
</style>
</head>

function getAll(m){
  const {raw,year,month,days}=MCONF[m];
  const arr=[];
  for(let d=1;d<=days;d++){
    (raw[d]||[]).forEach(s=>{
      const dt=new Date(year,month-1,d);
      arr.push({day:d,wd:dt.getDay(),store:s.s,sno:s.n,peak:s.p||''});
    });
  }
  return arr.sort((a,b)=>a.day-b.day||a.sno-b.sno);
}

function renderStats(all){
  const days=new Set(all.map(s=>s.day)).size;
  document.getElementById('stats').innerHTML=[
    {l:'ทั้งหมด',v:all.length,c:'#c4b5fd',bc:'rgba(139,92,246,.4)'},
    {l:'วันทำงาน',v:days,c:'#93c5fd',bc:'rgba(59,130,246,.4)'},
    {l:'เฉลี่ย/วัน',v:days?+(all.length/days).toFixed(1):0,c:'#86efac',bc:'rgba(34,197,94,.4)'}
  ].map(s=>`<div class="stat" style="border-color:${s.bc}"><div class="stat-num" style="color:${s.c}">${s.v}</div><div class="stat-label">${s.l}</div></div>`).join('');
}

function peakTag(p){
  if(!p) return '<span style="color:#334155;font-size:10px">—</span>';
  return p.split(',').map(t=>`<span class="peak-tag">⏰${t.trim()}</span>`).join(' ');
}

function renderTable(data){
  const conf=MCONF[curM];
  document.getElementById('tb').innerHTML=data.length===0
    ?`<tr><td colspan="6" class="no-data">ไม่พบข้อมูล</td></tr>`
    :data.map(s=>{
      const we=[0,6].includes(s.wd);
      return`<tr class="${we?'we-row':''}">
        <td style="font-weight:700;color:${we?'#fbbf24':'#e2e8f0'}">${s.day} ${conf.short}</td>
        <td class="wdc" style="font-size:11px;color:${we?'#fbbf24':'#94a3b8'}">${DTH[s.wd]}</td>
        <td class="store-no">${s.sno}</td>
        <td>${s.store}</td>
        <td><span class="zone-badge">BG10</span></td>
        <td>${peakTag(s.peak)}</td>
      </tr>`;
    }).join('');
}

function renderCal(){
  const {raw,days,startWd}=MCONF[curM];
  const WD=['อา','จ','อ','พ','พฤ','ศ','ส'];
  let h=WD.map((d,i)=>`<div class="cal-hdr ${i===0||i===6?'we':''}">${d}</div>`).join('');
  for(let i=0;i<startWd;i++) h+=`<div class="cal-day empty"></div>`;
  for(let d=1;d<=days;d++){
    const wd=(startWd+d-1)%7,we=wd===0||wd===6;
    const tot=(raw[d]||[]).length;
    h+=`<div class="cal-day ${tot?'has':''} ${selD===d?'sel':''} ${we?'we-bg':''}" onclick="pickD(${d})">
      <div class="cal-dnum ${we?'we':''}">${d}</div>
      ${tot?`<div class="cal-pill">${tot} ร้าน</div>`:``}
    </div>`;
  }
  document.getElementById('cg').innerHTML=h;
}

function pickD(d){
  selD=selD===d?null:d;
  renderCal();
  const el=document.getElementById('dp');
  if(!selD){el.classList.remove('show');return;}
  el.classList.add('show');
  const {raw,startWd,label}=MCONF[curM];
  const wd=(startWd+d-1)%7;
  document.getElementById('dpt').textContent=`📅 วัน${DTH[wd]} ${d} ${label}`;
  const stores=raw[d]||[];
  document.getElementById('dps').innerHTML=stores.map(s=>`<div class="dp-store">
    <span class="zdot"></span>
    <div class="dp-info">
      <div class="dp-sname">${s.s}</div>
      <div class="dp-meta">
        <span class="dp-sno">#${s.n}</span>
        ${s.p?`<span class="dp-peak">⏰ ${s.p}</span>`:''}
      </div>
    </div>
  </div>`).join('');
}

function applyFilter(){
  const q=document.getElementById('sb').value.toLowerCase();
  const all=getAll(curM);
  renderTable(q?all.filter(s=>s.store.toLowerCase().includes(q)||String(s.sno).includes(q)):all);
}

function setMonth(m){
  curM=m;selD=null;
  document.getElementById('mSep').classList.toggle('active',m==='sep');
  document.getElementById('mOct').classList.toggle('active',m==='oct');
  document.getElementById('sb').value='';
  const all=getAll(m);
  renderStats(all);renderTable(all);renderCal();
  document.getElementById('dp').classList.remove('show');
}

function setView(v){
  document.getElementById('tv').classList.toggle('hidden',v!=='table');
  document.getElementById('cv').classList.toggle('hidden',v!=='cal');
  document.getElementById('btnT').classList.toggle('active',v==='table');
  document.getElementById('btnC').classList.toggle('active',v==='cal');
}

// PWA Install
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();deferredPrompt=e;
  document.getElementById('installBar').classList.add('show');
});
document.getElementById('installBtn').addEventListener('click',async()=>{
  if(!deferredPrompt)return;
  deferredPrompt.prompt();
  const{outcome}=await deferredPrompt.userChoice;
  deferredPrompt=null;
  document.getElementById('installBar').classList.remove('show');
});
window.addEventListener('appinstalled',()=>{
  document.getElementById('installBar').classList.remove('show');
});
// iOS hint
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandalone=window.matchMedia('(display-mode:standalone)').matches;
if(isIOS&&!isStandalone) document.getElementById('iosHint').classList.add('show');

// Init
const initAll=getAll('sep');
renderStats(initAll);renderTable(initAll);renderCal();
</script>
</body>
</html>
