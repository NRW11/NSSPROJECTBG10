<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แผน NSS กันยายน 2569</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun','Noto Sans Thai',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
.topbar{background:linear-gradient(135deg,#1e3a5f,#1e293b);padding:14px 16px 12px;border-bottom:1px solid rgba(99,102,241,.3)}
.topbar h1{font-size:18px;font-weight:700;background:linear-gradient(135deg,#818cf8,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.topbar p{font-size:11px;color:#64748b;margin-top:3px}
.updated{font-size:10px;color:#f59e0b;margin-top:4px}
.stats{display:flex;gap:8px;padding:10px 16px;background:#0f172a;border-bottom:1px solid rgba(255,255,255,.06);flex-wrap:wrap}
.stat{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:6px 14px;text-align:center;min-width:72px}
.stat-num{font-size:18px;font-weight:700}
.stat-label{font-size:10px;color:#94a3b8}
.toolbar{display:flex;gap:8px;padding:10px 16px;align-items:center;flex-wrap:wrap;border-bottom:1px solid rgba(255,255,255,.06)}
.toolbar label{font-size:12px;color:#94a3b8}
select{background:#1e293b;color:#e2e8f0;border:1px solid rgba(255,255,255,.15);border-radius:6px;padding:5px 10px;font-family:inherit;font-size:12px;cursor:pointer}
.search-box{background:#1e293b;border:1px solid rgba(255,255,255,.15);border-radius:6px;padding:5px 10px;color:#e2e8f0;font-family:inherit;font-size:12px;width:180px}
.search-box::placeholder{color:#475569}
.view-btns{display:flex;gap:4px;margin-left:auto}
.vbtn{padding:5px 12px;border-radius:6px;border:1px solid rgba(255,255,255,.1);background:transparent;color:#64748b;font-size:12px;cursor:pointer;font-family:inherit;transition:all .15s}
.vbtn.active{background:rgba(99,102,241,.4);border-color:#6366f1;color:#c7d2fe}

/* TABLE */
.table-wrap{overflow-x:auto;padding:12px 16px}
table{width:100%;border-collapse:collapse;min-width:580px}
th{background:#1e293b;color:#94a3b8;font-size:11px;font-weight:700;padding:10px 12px;text-align:left;border-bottom:2px solid rgba(99,102,241,.3);white-space:nowrap}
td{padding:9px 12px;font-size:13px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:middle}
tr:hover td{background:rgba(255,255,255,.03)}
.zone-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700;border:1px solid}
.zone-BG1{background:rgba(59,130,246,.15);color:#60a5fa;border-color:rgba(59,130,246,.4)}
.zone-BG2{background:rgba(34,197,94,.15);color:#4ade80;border-color:rgba(34,197,94,.4)}
.zone-BG9{background:rgba(245,158,11,.15);color:#fbbf24;border-color:rgba(245,158,11,.4)}
.we-row td:first-child{color:#fbbf24}
.we-row .day-col{color:#fbbf24}
.store-no{color:#64748b;font-size:12px;font-family:monospace}
.no-data{text-align:center;color:#334155;padding:40px 20px;font-size:13px}

/* CALENDAR */
.cal-wrap{padding:12px 16px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-hdr{text-align:center;padding:8px 2px;font-size:11px;font-weight:700;color:#64748b}
.cal-hdr.we{color:#f87171}
.cal-day{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:7px 5px;min-height:80px;cursor:pointer;transition:all .15s}
.cal-day.has{border-color:rgba(255,255,255,.15)}
.cal-day.sel{border-color:#6366f1 !important;background:rgba(99,102,241,.2);box-shadow:0 0 0 1px #6366f1}
.cal-day.we-bg{background:rgba(251,191,36,.03)}
.cal-day.empty{background:transparent;border-color:transparent;cursor:default}
.cal-dnum{font-size:12px;font-weight:700;color:#cbd5e1;margin-bottom:4px}
.cal-dnum.we{color:#f87171}
.cal-pill{font-size:9px;padding:2px 4px;border-radius:3px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill-BG1{background:rgba(59,130,246,.25);color:#93c5fd}
.pill-BG2{background:rgba(34,197,94,.25);color:#86efac}
.pill-BG9{background:rgba(245,158,11,.25);color:#fcd34d}
.cal-tot{font-size:9px;color:#475569;margin-top:2px}

/* DETAIL */
.dp{background:#1e293b;border-top:2px solid rgba(99,102,241,.3);padding:16px;display:none;margin-top:4px;border-radius:0 0 12px 12px}
.dp.show{display:block}
.dp-title{font-size:15px;font-weight:700;color:#c7d2fe;margin-bottom:12px}
.dp-zones{display:flex;gap:12px;flex-wrap:wrap}
.dp-zone{flex:1;min-width:190px}
.dp-zhdr{font-size:12px;font-weight:700;padding:4px 10px;border-radius:6px;display:inline-block;margin-bottom:8px}
.dp-store{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.04);border-radius:7px;padding:7px 10px;font-size:12px;margin-bottom:5px}
.dp-sno{color:#475569;font-size:11px;font-family:monospace;min-width:48px}
.zdot{display:inline-block;width:8px;height:8px;border-radius:50%;flex-shrink:0}
.hidden{display:none}
</style>
</head>
<body>

<div class="topbar">
  <h1>📋 แผน Migrate NSS — กันยายน 2569</h1>
  <p>BG1 · BG2 · BG9  |  เฉพาะสาขาที่กำหนดวันแล้ว</p>
  <div class="updated">⏱ อัพเดทข้อมูล NSS เมื่อวันที่ 25-07-69</div>
</div>

<div class="stats" id="stats"></div>

<div class="toolbar">
  <label>โซน</label>
  <select id="zf" onchange="applyFilter()">
    <option value="ALL">ทั้งหมด</option>
    <option value="BG1">BG1</option>
    <option value="BG2">BG2</option>
    <option value="BG9">BG9</option>
  </select>
  <input class="search-box" id="sb" placeholder="🔍 ค้นหาชื่อร้าน..." oninput="applyFilter()">
  <div class="view-btns">
    <button class="vbtn active" id="btnT" onclick="setView('table')">📋 ตาราง</button>
    <button class="vbtn" id="btnC" onclick="setView('cal')">📅 ปฏิทิน</button>
  </div>
</div>

<div id="tv">
  <div class="table-wrap">
    <table><thead><tr>
      <th>วันที่</th><th>วัน</th><th>Store No</th><th>ชื่อสาขา</th><th>Zone</th>
    </tr></thead>
    <tbody id="tb"></tbody></table>
  </div>
</div>

<div id="cv" class="hidden">
  <div class="cal-wrap">
    <div class="cal-grid" id="cg"></div>
    <div class="dp" id="dp">
      <div class="dp-title" id="dpt"></div>
      <div class="dp-zones" id="dpz"></div>
    </div>
  </div>
</div>

<script>
const RAW={"2": {"BG1": [{"s": "Brix Condo", "n": 15087}], "BG2": [], "BG9": []}, "3": {"BG1": [{"s": "จรัญสนิทวงศ์ 44 แยก 15", "n": 20662}], "BG2": [], "BG9": []}, "4": {"BG1": [{"s": "จรัญ-44", "n": 128}], "BG2": [], "BG9": [{"s": "จรัญฯ 71", "n": 11190}]}, "5": {"BG1": [{"s": "แยกปิ่นเกล้า", "n": 18713}], "BG2": [], "BG9": [{"s": "จรัญฯ 65 จุด 3", "n": 6345}]}, "6": {"BG1": [{"s": "จรัญสนิทวงศ์ 40 จุด 3", "n": 8773}], "BG2": [], "BG9": [{"s": "บางอ้อ Home Town", "n": 13580}]}, "7": {"BG1": [{"s": "LPN สวีท ปิ่นเกล้า", "n": 6016}], "BG2": [], "BG9": [{"s": "ตลาดกรุงธน", "n": 15605}]}, "8": {"BG1": [{"s": "PS พลัมคอนโด ปิ่นเกล้า", "n": 17108}], "BG2": [], "BG9": [{"s": "ริเวอร์ไซด์", "n": 270}]}, "9": {"BG1": [{"s": "พาต้าปิ่นเกล้า", "n": 7416}], "BG2": [], "BG9": [{"s": "จรัญฯ 75 แยก 3", "n": 14483}]}, "10": {"BG1": [{"s": "ซอยอรุณอัมรินทร์ 30", "n": 22939}], "BG2": [], "BG9": [{"s": "จรัญสนิทวงศ์ 75/2", "n": 3593}]}, "11": {"BG1": [{"s": "เจริญสุข", "n": 2826}], "BG2": [], "BG9": []}, "12": {"BG1": [{"s": "LPN เพลส ปิ่นเกล้า 2", "n": 14415}], "BG2": [], "BG9": [{"s": "จรัญฯ 79", "n": 633}]}, "13": {"BG1": [{"s": "ถนนรุ่งประชา (บรมราชชนนี)", "n": 18447}], "BG2": [], "BG9": []}, "14": {"BG1": [{"s": "ป.กุ้งเผา (บรมราชชนนี)", "n": 13916}], "BG2": [], "BG9": [{"s": "จรัญฯ 97", "n": 17798}]}, "15": {"BG1": [], "BG2": [{"s": "ซอยเขียนนิวาสน์ (สวนสันติชัยปราการ)", "n": 23629}], "BG9": [{"s": "บางขนุนซอย 5 ปากซอย", "n": 19091}]}, "16": {"BG1": [], "BG2": [{"s": "สามเสน 2 จุด 2", "n": 7926}], "BG9": []}, "17": {"BG1": [], "BG2": [{"s": "ถนนรามบุตรี", "n": 22864}], "BG9": []}, "18": {"BG1": [], "BG2": [{"s": "ตรอกมะยม", "n": 8555}], "BG9": []}, "19": {"BG1": [], "BG2": [{"s": "ท่าเรือผ่านฟ้า", "n": 3524}], "BG9": [{"s": "จรัญฯ 69", "n": 19084}]}, "20": {"BG1": [], "BG2": [{"s": "ถนนดินสอ", "n": 117}], "BG9": []}, "21": {"BG1": [], "BG2": [{"s": "วังวรดิศ", "n": 694}], "BG9": [{"s": "จรัญฯ 75 แยก 20", "n": 19085}]}, "22": {"BG1": [], "BG2": [{"s": "ถนนจักรพรรดิพงษ์", "n": 5673}], "BG9": [{"s": "สิรินธร ซอย 7", "n": 16103}]}, "23": {"BG1": [], "BG2": [{"s": "กระออม", "n": 1567}], "BG9": [{"s": "ธนากรวิลล่า 2", "n": 11428}]}, "24": {"BG1": [], "BG2": [{"s": "บางลำภู 4", "n": 17222}], "BG9": []}, "25": {"BG1": [], "BG2": [{"s": "ถนนตานี", "n": 11016}], "BG9": []}, "26": {"BG1": [], "BG2": [{"s": "Buddy (ถนนข้าวสาร)", "n": 22515}], "BG9": []}, "27": {"BG1": [], "BG2": [{"s": "สมาคมหอการค้าไทย", "n": 4700}], "BG9": []}, "28": {"BG1": [], "BG2": [{"s": "กระทรวงมหาดไทย", "n": 1559}], "BG9": []}, "29": {"BG1": [], "BG2": [{"s": "หน้าพระลาน", "n": 1461}], "BG9": [{"s": "เลียบรางรถไฟสิรินธร-บางกรวย", "n": 15321}]}};
const DTH={0:'จันทร์',1:'อังคาร',2:'พุธ',3:'พฤหัส',4:'ศุกร์',5:'เสาร์',6:'อาทิตย์'};
const ZC={BG1:'#3b82f6',BG2:'#22c55e',BG9:'#f59e0b'};

let all=[];
for(let d=1;d<=30;d++){
  const day=RAW[d]||{};
  ['BG1','BG2','BG9'].forEach(z=>{
    (day[z]||[]).forEach(s=>{
      const dt=new Date(2026,8,d);
      all.push({day:d,wd:dt.getDay(),zone:z,store:s.s,sno:s.n});
    });
  });
}
all.sort((a,b)=>a.day-b.day||['BG1','BG2','BG9'].indexOf(a.zone)-['BG1','BG2','BG9'].indexOf(b.zone)||a.sno-b.sno);

function renderStats(){
  const c={BG1:0,BG2:0,BG9:0};
  all.forEach(s=>c[s.zone]++);
  document.getElementById('stats').innerHTML=[
    {l:'ทั้งหมด',v:all.length,c:'#a5b4fc',bc:'rgba(99,102,241,.4)'},
    {l:'BG1',v:c.BG1,c:'#60a5fa',bc:'rgba(59,130,246,.4)'},
    {l:'BG2',v:c.BG2,c:'#4ade80',bc:'rgba(34,197,94,.4)'},
    {l:'BG9',v:c.BG9,c:'#fbbf24',bc:'rgba(245,158,11,.4)'}
  ].map(s=>`<div class="stat" style="border-color:${s.bc}"><div class="stat-num" style="color:${s.c}">${s.v}</div><div class="stat-label">${s.l}</div></div>`).join('');
}

function renderTable(data){
  document.getElementById('tb').innerHTML=data.length===0
    ?`<tr><td colspan="5" class="no-data">ไม่พบข้อมูล</td></tr>`
    :data.map(s=>{
      const we=[0,6].includes(s.wd);
      return`<tr class="${we?'we-row':''}">
        <td style="font-weight:700;color:${we?'#fbbf24':'#e2e8f0'}">${s.day}</td>
        <td class="day-col" style="font-size:12px;color:${we?'#fbbf24':'#94a3b8'}">${DTH[s.wd]}</td>
        <td class="store-no">${s.sno}</td>
        <td style="font-size:13px">${s.store}</td>
        <td><span class="zone-badge zone-${s.zone}">${s.zone}</span></td>
      </tr>`;
    }).join('');
}

let selD=null;
function renderCal(){
  const WD=['อา','จ','อ','พ','พฤ','ศ','ส'];
  // กันยายน 2569 เริ่มวันอังคาร = index 2
  let h=WD.map((d,i)=>`<div class="cal-hdr ${i===0||i===6?'we':''}">${d}</div>`).join('');
  for(let i=0;i<2;i++) h+=`<div class="cal-day empty"></div>`;
  for(let d=1;d<=30;d++){
    const dt=new Date(2026,8,d);
    const wd=dt.getDay(), we=wd===0||wd===6;
    const day=RAW[d]||{};
    const tot=['BG1','BG2','BG9'].reduce((a,z)=>a+(day[z]||[]).length,0);
    const pills=['BG1','BG2','BG9'].filter(z=>(day[z]||[]).length).map(z=>
      `<div class="cal-pill pill-${z}">${z}:${(day[z]||[]).length}</div>`).join('');
    h+=`<div class="cal-day ${tot?'has':''} ${selD===d?'sel':''} ${we?'we-bg':''}" onclick="pickD(${d})">
      <div class="cal-dnum ${we?'we':''}">${d}</div>
      ${pills}
      ${tot?`<div class="cal-tot">${tot} ร้าน</div>`:''}
    </div>`;
  }
  document.getElementById('cg').innerHTML=h;
}

function pickD(d){
  selD=selD===d?null:d;
  renderCal();
  const el=document.getElementById('dp');
  if(!selD){el.classList.remove('show');return;}
  el.classList.add('show');
  const dt=new Date(2026,8,d);
  document.getElementById('dpt').textContent=`📅 วัน${DTH[dt.getDay()]} ${d} กันยายน 2569`;
  const day=RAW[d]||{};
  document.getElementById('dpz').innerHTML=['BG1','BG2','BG9'].map(z=>{
    const stores=day[z]||[];
    if(!stores.length) return '';
    const bg={BG1:'rgba(59,130,246,.2)',BG2:'rgba(34,197,94,.2)',BG9:'rgba(245,158,11,.2)'}[z];
    const tc={BG1:'#60a5fa',BG2:'#4ade80',BG9:'#fbbf24'}[z];
    return`<div class="dp-zone">
      <div class="dp-zhdr" style="background:${bg};color:${tc}">${z} — ${stores.length} ร้าน</div>
      ${stores.map(s=>`<div class="dp-store">
        <span class="zdot" style="background:${ZC[z]}"></span>
        <span class="dp-sno">${s.n}</span>
        <span>${s.s}</span>
      </div>`).join('')}
    </div>`;
  }).join('');
}

function applyFilter(){
  const z=document.getElementById('zf').value;
  const q=document.getElementById('sb').value.toLowerCase();
  renderTable(all.filter(s=>(z==='ALL'||s.zone===z)&&(q===''||s.store.toLowerCase().includes(q)||String(s.sno).includes(q))));
}

function setView(v){
  document.getElementById('tv').classList.toggle('hidden',v!=='table');
  document.getElementById('cv').classList.toggle('hidden',v!=='cal');
  document.getElementById('btnT').classList.toggle('active',v==='table');
  document.getElementById('btnC').classList.toggle('active',v==='cal');
}

renderStats(); renderTable(all); renderCal();
</script>
</body>
</html>
